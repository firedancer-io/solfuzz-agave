[workspace]
members = []
exclude = ["agave"]

[workspace.dependencies]
solana-pubkey = { version = "=4.4.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[package]
name = "solfuzz-agave"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "bench_txn"
harness = false

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
lazy_static = "1.5.0"
prost = "0.14.4"
protosol = { version = "=18.0.0", features = ["solana-types"] }
ahash = "0.8.12"
bincode = "1.3.3"
serde = { version = "1.0.229", features = ["derive"] }
# jemalloc (pulled in via solana-core's jemalloc-ctl) defaults to initial-exec TLS, which breaks dlopen of this cdylib
tikv-jemalloc-sys = { version = "0.6.1", features = ["disable_initial_exec_tls"] }

solana-account = "=5.1.1"
solana-clock = "=4.0.0"
solana-feature-gate-interface = "=5.0.0"
solana-epoch-schedule = "=3.4.0"
solana-fee-calculator = "=3.4.0"
solana-hard-forks = "=3.3.0"
solana-hash = "=4.7.0"
solana-inflation = "=3.3.0"
solana-message = "=6.0.0"
solana-packet = "=4.4.1"
wincode = "0.6.3"
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { version = "=3.6.0", default-features = false }
solana-stake-interface = "=5.1.1"
solana-sysvar = { version = "=5.0.0", features = ["serde"] }
solana-transaction = "=6.0.0"
solana-rent = { version = "=4.5.0", features = ["serde"] }

# Enable dev-context-only-utils for Agave dependencies that need it
agave-feature-set = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
solana-runtime = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-accounts-db = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-lattice-hash = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
solana-svm = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils", "conformance"] }
solana-vote = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-gossip = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-ledger = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
agave-votor-messages = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
solana-core = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
solana-streamer = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", features = ["agave-unstable-api"] }
agave-conformance = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", default-features = false, features = ["ffi"] }
solana-svm-conformance = { git = "https://github.com/firedancer-io/agave", rev = "121e1be0cd3dc0b3b945585038dde9da619bf53f", version = "=4.5.0-beta.0", default-features = false, features = ["ffi"] }
[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = "0.8.2"
solana-address-lookup-table-interface = { version = "=4.0.0", features = ["bincode"] }
solana-loader-v3-interface = "=9.0.0"
solana-slot-hashes = "=4.0.0"
solana-sysvar-id = "=3.1.0"

[features]
# This feature is used to compile a target with a builtin replaced by a BPF program.
# Requires the `CORE_BPF_PROGRAM_ID` and `CORE_BPF_TARGET` environment variables.
core-bpf = []
# Same as the `core-bpf` feature, but also includes special-casing required for
# conformance testing a BPF program against a builtin.
core-bpf-conformance = []
bpf-program-conformance = []

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
split-debuginfo = "off"

[profile.release]
split-debuginfo = "unpacked"
lto = "thin"

# Restated from agave: cargo [patch] does not propagate, and solana-ledger needs the fork's APIs.
[patch.crates-io]
blstrs = { git = "https://github.com/anza-xyz/blstrs", rev = "a1faffa3420bdaf4102425c43f00cdd815d4f145" }
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
