[workspace]
members = []
exclude = ["agave"]

[workspace.dependencies]
solana-pubkey = { version = "=4.3.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[package]
name = "solfuzz-agave"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "bench_txn"
harness = false

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
lazy_static = "1.5.0"
prost = "0.14.4"
protosol = { version = "=12.0.0", features = ["solana-types"] }
ahash = "0.8.12"
bincode = "1.3.3"
serde = { version = "1.0.229", features = ["derive"] }
# jemalloc (pulled in via solana-core's jemalloc-ctl) defaults to initial-exec TLS, which breaks dlopen of this cdylib
tikv-jemalloc-sys = { version = "0.6.1", features = ["disable_initial_exec_tls"] }

solana-account = "=4.5.0"
solana-clock = "=3.2.0"
solana-feature-gate-interface = { version = "=4.0.0", features = ["bincode"] }
solana-epoch-schedule = "=3.3.0"
solana-fee-calculator = "=3.3.0"
solana-hard-forks = "=3.2.0"
solana-hash = "=4.6.0"
solana-inflation = "=3.2.0"
solana-message = "=4.5.0"
solana-packet = "=4.3.0"
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signature = { version = "=3.5.1", default-features = false }
solana-stake-interface = "=4.4.0"
solana-sysvar = "=4.2.0"
solana-transaction = "=4.2.0"
solana-rent = { version = "=4.4.0", features = ["serde"] }

# Enable dev-context-only-utils for Agave dependencies that need it
agave-feature-set = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"]}
agave-logger = { git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"] }
solana-runtime = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils", "conformance"]}
solana-accounts-db = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-lattice-hash = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"]}
solana-svm = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils", "conformance"]}
solana-vote = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-gossip = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils", "conformance"]}
solana-ledger = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
agave-votor-messages = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"]}
solana-core = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"]}
solana-streamer = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", features = ["agave-unstable-api"]}
solana-svm-conformance = {git = "https://github.com/firedancer-io/agave", rev = "2c1631213b5f619419c0d4abae6745d6a0e9810f", version = "=4.3.0-beta.0", default-features = false, features = ["ffi"]}

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = "0.8.2"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode"] }
solana-loader-v3-interface = { version = "=7.0.0", features = ["bincode"] }
solana-slot-hashes = "=3.2.0"
solana-sysvar-id = "=3.1.0"

[features]
# This feature is used to compile a target with a builtin replaced by a BPF program.
# Requires the `CORE_BPF_PROGRAM_ID` and `CORE_BPF_TARGET` environment variables.
core-bpf = []
# Same as the `core-bpf` feature, but also includes special-casing required for
# conformance testing a BPF program against a builtin.
core-bpf-conformance = []
bpf-program-conformance = []

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
split-debuginfo = "off"

[profile.release]
split-debuginfo = "unpacked"
lto = "thin"

# Mirrors agave's [patch.crates-io] rocksdb fork. REQUIRED, not cosmetic:
# cargo patches do not propagate to downstream consumers, and agave v4.3's
# solana-ledger calls fork-only APIs (get_pinned_cf_into, new_pinnable_slice,
# DBPinnableSlice::reset) that crates.io rocksdb 0.24.0 does not have.
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "2c0ffd79c1b2e1f5220ee5f7c71af5080a5309e3" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "2c0ffd79c1b2e1f5220ee5f7c71af5080a5309e3" }
