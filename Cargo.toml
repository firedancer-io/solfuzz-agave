[package]
name = "solfuzz-agave"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "bench_txn"
harness = false

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
solfuzz-agave-macro = { path = "macro" }
lazy_static = "1.5.0"
thiserror = "2.0.18"
flatbuffers = "25.9.23"
prost = "0.11.9"
protosol = {git = "https://github.com/firedancer-io/protosol", tag = "v5.0.1", features = ["solana-types"]}
ahash = "0.8.12"
serde_json = "1.0.149"
bincode = "1.3.3"
serde = { version = "1.0.228", features = ["derive"] }
wincode = "=0.4.5"

solana-account = "3.4.0"
solana-clock = "3.0.1"
solana-epoch-schedule = "3.0.0"
solana-fee-calculator = "3.1.0"
solana-hard-forks = "3.0.0"
solana-hash = "4.2.0"
solana-inflation = "3.0.0"
solana-instruction = "3.2.0"
solana-keypair = "3.1.0"
solana-message = "3.1.0"
solana-poseidon = "4.0.0"
solana-precompile-error = "3.0.0"
solana-pubkey = "4.1.0"
solana-sdk-ids = "3.1.0"
solana-signature = { version = "3.3.0", default-features = false }
solana-stable-layout = "3.0.0"
solana-stake-interface = "2.0.2"
solana-vote-interface = { version = "5.0.0", features = ["serde"] }
solana-sysvar = "3.1.1"
solana-transaction = "3.1.0"
solana-transaction-error = "3.0.0"
solana-zk-sdk = "5.0.1"

# Fix solana-rent, for some reason it's detected as 4.0.0
solana-rent = { version = "=3.0.0", features = ["serde"] }

# Enable dev-context-only-utils for Agave dependencies that need it
agave-feature-set = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
agave-syscalls = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", default-features = false, features = ["agave-unstable-api"]}
agave-votor-messages = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
agave-precompiles = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
agave-logger = { git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"] }
solana-runtime = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-accounts-db = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-entry = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-lattice-hash = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-ledger = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-svm = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-vote = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-transaction-context = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "bincode", "dev-context-only-utils"]}
solana-vote-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api", "dev-context-only-utils"]}
solana-compute-budget = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-program-runtime = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-svm-callback = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-svm-log-collector = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-svm-feature-set = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-svm-timings = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-bpf-loader-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", default-features = false, features = ["agave-unstable-api"]}
solana-loader-v4-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", default-features = false, features = ["agave-unstable-api"]}
solana-compute-budget-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-system-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-zk-elgamal-proof-program = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-gossip = {git = "https://github.com/firedancer-io/agave", rev = "293b39e6d997fd8bd2a468784905bc986ae6f981", version = "=4.0.0-alpha.0", features = ["agave-unstable-api"]}
solana-sanitize = "3.0.1"
solana-sbpf = {git = "https://github.com/firedancer-io/sbpf", branch = "sbpf-v0.14.4-patches", version = "=0.14.4", default-features = false}

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
flatc-rust = "0.2.0"

[dev-dependencies]
solana-address-lookup-table-interface = { version = "3.0.1", features = ["bincode"] }
solana-loader-v3-interface = { version = "6.1.0", features = ["bincode"] }
solana-slot-hashes = "3.0.1"
solana-sysvar-id = "3.1.0"

[features]
# This feature is used to compile a target with a builtin replaced by a BPF program.
# Requires the `CORE_BPF_PROGRAM_ID` and `CORE_BPF_TARGET` environment variables.
core-bpf = []
# Same as the `core-bpf` feature, but also includes special-casing required for
# conformance testing a BPF program against a builtin.
core-bpf-conformance = []
bpf-program-conformance = []

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
split-debuginfo = "off"

[profile.release]
split-debuginfo = "unpacked"
lto = "thin"
