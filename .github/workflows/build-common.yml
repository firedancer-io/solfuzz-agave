name: "Build, check, test, release common"
on:
  workflow_call:
    inputs:
      upload_artifacts:
        required: true
        type: boolean
        default: false
        description: "Upload artifacts to GitHub for consumption by fuzzcorp"


jobs:
  test:
    name: cargo check + test
    runs-on: [self-hosted]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: "clippy, rustfmt"
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install dependencies
        run: |
          sudo dnf install -y protobuf-compiler
          sudo dnf install -y systemd-devel

      - name: Clone protosol
        run: make fetch_proto

      - name: Check lints and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all -- -D warnings

      - name: Run cargo check + test
        run: |
          cargo check --release
          cargo test --release

      - name: Build shared objects
        run: make shared_obj

      - name: Build cov-enabled shared objects
        if: ${{ inputs.upload_artifacts }}
        run: |
          make shared_obj_cov
          cd src && pwd > buildpwd && cd -
          cp -r ./src/ ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave_src/

      - name: Make binaries
        run: make binaries

      - name: Run test-vectors
        run: |
          ./scripts/run_test_vectors.sh

      - name: Upload main so
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: libsolfuzz-agave.so
          path: |
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave.so
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave+cov.so
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave_src/

      - name: Upload stubbed so
        uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_artifacts }}
        with:
          name: libsolfuzz-agave-stubbed.so
          path: |
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave_stubbed.so
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave_stubbed+cov.so
            ./target/x86_64-unknown-linux-gnu/release/libsolfuzz_agave_src/
